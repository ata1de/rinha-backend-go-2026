services:

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api1: &api
    build: .
    environment:
      PORT: "3000"
      GOMAXPROCS: "1"
      GOGC: "300"
      GOMEMLIMIT: "120MiB"
    networks:
      - rinha
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    <<: *api

networks:
  rinha:
    driver: bridge
