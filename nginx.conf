worker_processes 1;
worker_rlimit_nofile 8192;

error_log /dev/null crit;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65s;
    keepalive_requests 1000000;

    upstream api {
        server api1:3000;
        server api2:3000;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 9999 default_server reuseport backlog=4096;

        location / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
    }
}
